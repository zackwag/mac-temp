name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Build universal binary
        run: make release

      - name: Attach binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" mac-temp --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 mac-temp | awk '{print $1}')
          BRANCH="update-mac-temp-${VERSION}"

          git clone https://x-access-token:${TAP_TOKEN}@github.com/zackwag/homebrew-tap.git /tmp/tap
          cd /tmp/tap
          git checkout -b "$BRANCH"

          cat > Formula/mac-temp.rb << EOF2
          class MacTemp < Formula
            desc "Lightweight CLI to read CPU and thermal sensor temperatures on Apple Silicon Macs"
            homepage "https://github.com/zackwag/mac-temp"
            version "${VERSION}"
            url "https://github.com/zackwag/mac-temp/releases/download/v${VERSION}/mac-temp"
            sha256 "${SHA}"
            license "MIT"

            depends_on :macos

            def install
              bin.install "mac-temp"
            end

            test do
              system "true"
            end
          end
          EOF2
          sed -i '' 's/^          //' Formula/mac-temp.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mac-temp.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(mac-temp): update to ${VERSION}"
          git push origin "$BRANCH"

          export GH_TOKEN="$TAP_TOKEN"
          gh pr create --repo zackwag/homebrew-tap --base main --head "$BRANCH" \
            --title "chore(mac-temp): update to ${VERSION}" \
            --body "Automated update from a mac-temp release."

          pr_number=$(gh pr list --repo zackwag/homebrew-tap --head "$BRANCH" --json number -q '.[0].number')
          sleep 20
          for i in $(seq 1 40); do
            total=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '.statusCheckRollup | length')
            pending=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '[.statusCheckRollup[] | select(.status!="COMPLETED")] | length')
            if [ "$total" != "0" ] && [ "$pending" = "0" ]; then break; fi
            sleep 15
          done

          bad=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '[.statusCheckRollup[] | select((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not)] | length')
          if [ "$bad" != "0" ]; then
            echo "::error::$bad check(s) did not succeed; leaving PR #$pr_number open for review."
            exit 1
          fi

          gh pr merge "$pr_number" --repo zackwag/homebrew-tap --squash --delete-branch
